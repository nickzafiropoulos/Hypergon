<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>HYPERGON — vector arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05060f;
    --ion:#63f7ff;
    --plasma:#ff3fa4;
    --acid:#b8ff3d;
    --amber:#ffb02e;
    --ash:rgba(240,248,255,.55);
    --hud: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--void);}
  body{font-family:var(--hud);color:#eaf6ff;-webkit-user-select:none;user-select:none;touch-action:none;cursor:crosshair;}
  canvas{display:block;position:fixed;inset:0;}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;padding:18px 22px;display:flex;flex-direction:column;justify-content:space-between;}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;}
  .stack{display:flex;flex-direction:column;gap:2px;}
  .lbl{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--ash);}
  .val{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em;
       text-shadow:0 0 18px currentColor;}
  #score{color:#eaf6ff}
  #mult{color:var(--acid);font-size:38px}
  #wave{color:var(--ion);font-size:18px}
  .right{text-align:right;align-items:flex-end}

  #pips{display:flex;gap:6px;margin-top:5px}
  .pip{width:11px;height:11px;transform:rotate(45deg);border:1.5px solid var(--ion);box-shadow:0 0 10px var(--ion)}
  .pip.b{border-color:var(--amber);box-shadow:0 0 10px var(--amber);border-radius:50%;transform:none}
  .pip.off{opacity:.18;box-shadow:none}

  /* weapon block */
  #weap{min-width:230px}
  #wname{font-size:22px;font-weight:700;letter-spacing:.14em;color:var(--plasma);text-shadow:0 0 18px currentColor}
  #wbar{height:4px;background:rgba(255,255,255,.1);margin-top:7px;position:relative;overflow:hidden}
  #wfill{position:absolute;inset:0;width:100%;transform-origin:right;background:var(--plasma);box-shadow:0 0 12px var(--plasma)}
  #wammo{font-size:11px;letter-spacing:.2em;color:var(--ash);margin-top:5px;font-variant-numeric:tabular-nums}

  /* powerup timers */
  #buffs{display:flex;flex-direction:column;gap:5px;align-items:flex-end;margin-bottom:6px}
  .buff{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
  .buff .bar{width:74px;height:3px;background:rgba(255,255,255,.12);position:relative}
  .buff .bar i{position:absolute;inset:0;transform-origin:left;display:block}

  /* toasts */
  #toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);text-align:center;pointer-events:none;
         font-size:clamp(26px,5vw,54px);font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:0;
         text-shadow:0 0 30px currentColor;transition:opacity .25s}
  #toastsub{font-size:12px;letter-spacing:.42em;color:var(--ash);margin-top:8px;text-shadow:none}

  /* ---------- overlays ---------- */
  #veil{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,rgba(9,12,32,.82),rgba(3,4,10,.96));
        backdrop-filter:blur(3px);z-index:5}
  #veil.hide{display:none}
  .panel{width:min(880px,92vw);text-align:center}
  .glyph{font-size:clamp(46px,9vw,104px);font-weight:700;letter-spacing:.24em;margin:0 0 4px;
         background:linear-gradient(96deg,var(--ion),var(--plasma) 55%,var(--amber));
         -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(99,247,255,.35))}
  .tag{font-size:11px;letter-spacing:.55em;color:var(--ash);text-transform:uppercase;margin-bottom:34px}
  .keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;background:rgba(255,255,255,.09);
        border:1px solid rgba(255,255,255,.09);margin-bottom:30px;text-align:left}
  .key{background:#070a18;padding:13px 15px}
  .key b{display:block;font-size:12px;letter-spacing:.18em;color:var(--ion);margin-bottom:3px;font-weight:600}
  .key span{font-size:12px;color:var(--ash);line-height:1.45}
  .cta{font:inherit;font-size:13px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--void);
       background:var(--ion);border:0;padding:16px 46px;cursor:pointer;box-shadow:0 0 34px rgba(99,247,255,.45);pointer-events:auto}
  .cta:hover{background:#fff;box-shadow:0 0 44px rgba(255,255,255,.6)}
  .cta:focus-visible{outline:2px solid var(--plasma);outline-offset:4px}
  .fine{margin-top:20px;font-size:11px;letter-spacing:.24em;color:rgba(240,248,255,.32);text-transform:uppercase}
  .stats{display:flex;justify-content:center;gap:46px;margin:0 0 30px}
  .stats div{text-align:center}
  .stats .val{font-size:34px}
  @media (max-width:640px){ #weap{min-width:150px} .val{font-size:22px} #mult{font-size:28px} }
  @media (prefers-reduced-motion:reduce){ #toast{transition:none} }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="row">
    <div class="stack">
      <span class="lbl">Score</span>
      <span class="val" id="score">0</span>
      <div id="pips"></div>
    </div>
    <div class="stack" style="align-items:center">
      <span class="lbl">Multiplier</span>
      <span class="val" id="mult">×1</span>
    </div>
    <div class="stack right">
      <span class="lbl">Sector</span>
      <span class="val" id="wave">01</span>
    </div>
  </div>
  <div class="row" style="align-items:flex-end">
    <div class="stack" id="weap">
      <span class="lbl">Weapon</span>
      <span id="wname">PULSE</span>
      <div id="wbar"><i id="wfill"></i></div>
      <span id="wammo">UNLIMITED</span>
    </div>
    <div class="stack right">
      <div id="buffs"></div>
      <span class="lbl" id="hint">Q / E swap weapon · F auto-fire · P pause</span>
    </div>
  </div>
</div>

<div id="toast"><span id="toasttxt"></span><div id="toastsub"></div></div>

<div id="veil">
  <div class="panel" id="panel"></div>
</div>

<script>
(() => {
'use strict';

/* ══════════════════════════════════════════════════════════
   HYPERGON — a twin-stick vector arena
   Single file. No dependencies. Everything is drawn as maths.
   ══════════════════════════════════════════════════════════ */

// ---------------------------------------------------------- canvas
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d', {alpha:false});
const bloomC = document.createElement('canvas');
const bctx = bloomC.getContext('2d');
let W = 0, H = 0, DPR = 1;
let bloomOn = true;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = (W*DPR)|0; cvs.height = (H*DPR)|0;
  cvs.style.width = W+'px'; cvs.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  bloomC.width  = Math.max(2,(W/4)|0);
  bloomC.height = Math.max(2,(H/4)|0);
  buildGrid();
}
window.addEventListener('resize', resize);

// ---------------------------------------------------------- maths
const TAU = Math.PI*2;
const rnd  = (a=1,b=0)=> b + Math.random()*(a-b);
const rndi = (a,b)=> (rnd(a,b)|0);
const clamp= (v,a,b)=> v<a?a:v>b?b:v;
const lerp = (a,b,t)=> a+(b-a)*t;
const pick = arr => arr[(Math.random()*arr.length)|0];
function len(x,y){ return Math.hypot(x,y); }
function norm(x,y){ const l=Math.hypot(x,y)||1; return [x/l,y/l]; }
function angDiff(a,b){ let d=(a-b+Math.PI)%TAU; if(d<0)d+=TAU; return d-Math.PI; }

// ---------------------------------------------------------- audio (tiny synth)
let actx = null, muted = false, lastBlip = 0;
function tone(freq, dur, type='square', vol=.06, slide=0){
  if(muted) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), actx.currentTime+dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+dur+.02);
  }catch(e){}
}
function noise(dur=.25, vol=.2){
  if(muted) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const n = (actx.sampleRate*dur)|0;
    const buf = actx.createBuffer(1,n,actx.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n,2.2);
    const s = actx.createBufferSource(); s.buffer = buf;
    const g = actx.createGain(); g.gain.value = vol;
    const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400;
    s.connect(f).connect(g).connect(actx.destination); s.start();
  }catch(e){}
}
const SFX = {
  shoot(){ const t=performance.now(); if(t-lastBlip<38) return; lastBlip=t; tone(rnd(760,620), .05,'square',.028,-260); },
  rail(){ tone(140,.32,'sawtooth',.08,620); noise(.18,.12); },
  arc(){ tone(rnd(1500,1100),.09,'sawtooth',.035,-700); },
  pop(){ noise(.22,.16); tone(rnd(200,140),.2,'triangle',.05,-90); },
  big(){ noise(.5,.3); tone(70,.55,'sine',.12,-40); },
  gem(){ tone(rnd(1450,1150),.06,'sine',.035,320); },
  power(){ tone(520,.09,'sine',.07,0); setTimeout(()=>tone(780,.09,'sine',.07),70); setTimeout(()=>tone(1180,.16,'sine',.07),140); },
  weapon(){ tone(300,.08,'square',.06,0); setTimeout(()=>tone(600,.14,'square',.06,180),80); },
  bomb(){ noise(.9,.34); tone(52,.9,'sine',.16,-20); },
  death(){ noise(1.0,.3); tone(300,.9,'sawtooth',.1,-260); },
};

// ---------------------------------------------------------- warping grid
const GAP = 42;
let gcols=0, grows=0, gp=[];
function buildGrid(){
  gcols = Math.ceil(W/GAP)+2; grows = Math.ceil(H/GAP)+2;
  gp = new Array(gcols*grows);
  for(let r=0;r<grows;r++) for(let c=0;c<gcols;c++){
    gp[r*gcols+c] = { ax:(c-1)*GAP, ay:(r-1)*GAP, x:(c-1)*GAP, y:(r-1)*GAP, vx:0, vy:0 };
  }
}
// power is an instantaneous velocity impulse; positive shoves the grid away,
// negative dimples it inwards. Only the cells inside the radius are touched.
function gridImpulse(x,y,power,radius){
  const m = 3;                                    // slack for displaced points
  const c0 = Math.max(0, Math.floor((x-radius)/GAP)+1-m), c1 = Math.min(gcols-1, Math.ceil((x+radius)/GAP)+1+m);
  const r0 = Math.max(0, Math.floor((y-radius)/GAP)+1-m), r1 = Math.min(grows-1, Math.ceil((y+radius)/GAP)+1+m);
  const r2 = radius*radius, P = power*60;
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    const p = gp[r*gcols+c], dx = p.x-x, dy = p.y-y, d2 = dx*dx+dy*dy;
    if(d2 > r2 || d2 < 4) continue;
    const d = Math.sqrt(d2), f = P * (1 - d/radius) / d;
    p.vx += dx*f; p.vy += dy*f;
  }
}
const MAXPULL = 92;                               // hard cap on grid distortion
function updateGrid(dt){
  const damp = Math.pow(.90, dt*60);
  for(let r=0;r<grows;r++){
    for(let c=0;c<gcols;c++){
      const i = r*gcols+c, p = gp[i];
      const ox = p.x-p.ax, oy = p.y-p.ay;
      // neighbour coupling — this is what propagates the shockwave outwards
      let nx=0, ny=0, n=0;
      if(c>0){ const q=gp[i-1]; nx+=q.x-q.ax; ny+=q.y-q.ay; n++; }
      if(c<gcols-1){ const q=gp[i+1]; nx+=q.x-q.ax; ny+=q.y-q.ay; n++; }
      if(r>0){ const q=gp[i-gcols]; nx+=q.x-q.ax; ny+=q.y-q.ay; n++; }
      if(r<grows-1){ const q=gp[i+gcols]; nx+=q.x-q.ax; ny+=q.y-q.ay; n++; }
      if(n){ p.vx += ((nx/n)-ox)*260*dt; p.vy += ((ny/n)-oy)*260*dt; }
      p.vx += -ox*70*dt; p.vy += -oy*70*dt;       // spring home
      p.vx *= damp; p.vy *= damp;
      p.x += p.vx*dt; p.y += p.vy*dt;
      const dx = p.x-p.ax, dy = p.y-p.ay, dd = Math.hypot(dx,dy);
      if(dd > MAXPULL){ p.x = p.ax+dx/dd*MAXPULL; p.y = p.ay+dy/dd*MAXPULL; p.vx*=.4; p.vy*=.4; }
    }
  }
}
function drawGrid(){
  ctx.lineWidth = 1;
  ctx.beginPath();                          // calm lines
  const hot = [];
  for(let r=0;r<grows;r++) for(let c=0;c<gcols;c++){
    const i=r*gcols+c, p=gp[i];
    if(c<gcols-1){ const q=gp[i+1]; const s=Math.abs(p.x-p.ax)+Math.abs(q.x-q.ax)+Math.abs(p.y-p.ay)+Math.abs(q.y-q.ay);
      if(s>16) hot.push(p,q); else { ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); } }
    if(r<grows-1){ const q=gp[i+gcols]; const s=Math.abs(p.x-p.ax)+Math.abs(q.x-q.ax)+Math.abs(p.y-p.ay)+Math.abs(q.y-q.ay);
      if(s>16) hot.push(p,q); else { ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); } }
  }
  ctx.strokeStyle = 'rgba(58,84,158,.42)'; ctx.stroke();
  if(hot.length){
    ctx.beginPath();
    for(let i=0;i<hot.length;i+=2){ ctx.moveTo(hot[i].x,hot[i].y); ctx.lineTo(hot[i+1].x,hot[i+1].y); }
    ctx.strokeStyle = 'rgba(126,196,255,.85)'; ctx.lineWidth = 1.4; ctx.stroke();
  }
}

// ---------------------------------------------------------- input
const keys = Object.create(null);
const mouse = { x:0, y:0, down:false };
addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyQ','KeyE'].includes(e.code)) e.preventDefault();
  if(keys[e.code]) return;
  keys[e.code] = true;
  if(e.code==='KeyP' || e.code==='Escape') togglePause();
  if(e.code==='KeyM'){ muted = !muted; toast(muted?'MUTED':'SOUND ON','',420); }
  if(e.code==='KeyB'){ bloomOn = !bloomOn; toast(bloomOn?'BLOOM ON':'BLOOM OFF','',420); }
  if(e.code==='KeyF'){ autofire = !autofire; toast(autofire?'AUTO-FIRE ON':'AUTO-FIRE OFF','',520,'#ffb02e'); }
  if(e.code==='KeyQ') cycleWeapon(-1);
  if(e.code==='KeyE') cycleWeapon(1);
  if(e.code==='Space') fireBomb();
  if(e.code==='Enter' && state!=='play') startRun();
});
addEventListener('keyup', e=>{ keys[e.code]=false; });
addEventListener('mousemove', e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });
addEventListener('mousedown', e=>{ if(e.button===0) mouse.down=true; if(e.button===2) fireBomb(); });
addEventListener('mouseup',   e=>{ if(e.button===0) mouse.down=false; });
addEventListener('contextmenu', e=>e.preventDefault());
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; mouse.down=false; if(state==='play') togglePause(); });

// touch: left half = move stick, right half = aim + fire
const touchMove = {id:null, ox:0, oy:0, x:0, y:0};
const touchAim  = {id:null, ox:0, oy:0, x:0, y:0};
function onTouch(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(e.type==='touchstart'){
      const st = t.clientX < W/2 ? touchMove : touchAim;
      if(st.id===null){ st.id=t.identifier; st.ox=st.x=t.clientX; st.oy=st.y=t.clientY; }
    } else {
      for(const st of [touchMove,touchAim]) if(st.id===t.identifier){
        if(e.type==='touchmove'){ st.x=t.clientX; st.y=t.clientY; }
        else { st.id=null; }
      }
    }
  }
}
['touchstart','touchmove','touchend','touchcancel'].forEach(t=>addEventListener(t,onTouch,{passive:false}));

function readSticks(){
  let mx=0,my=0,ax=0,ay=0,firing=false;
  if(keys.KeyW) my-=1;
  if(keys.KeyS) my+=1;
  if(keys.KeyA) mx-=1;
  if(keys.KeyD) mx+=1;
  if(keys.ArrowUp) { ay-=1; firing=true; } if(keys.ArrowDown){ ay+=1; firing=true; }
  if(keys.ArrowLeft){ ax-=1; firing=true; } if(keys.ArrowRight){ ax+=1; firing=true; }
  // gamepad — some embeds block this by permissions policy, so probe once and give up quietly
  if(padsOk){
    let pads = null;
    try { pads = navigator.getGamepads ? navigator.getGamepads() : null; }
    catch(err){ padsOk = false; pads = null; }
    if(pads) for(const p of pads){ if(!p) continue;
      const dz = v => Math.abs(v)>.22 ? v : 0;
      mx += dz(p.axes[0]||0); my += dz(p.axes[1]||0);
      const rx = dz(p.axes[2]||0), ry = dz(p.axes[3]||0);
      if(rx||ry){ ax+=rx; ay+=ry; firing=true; }
      if(p.buttons[7] && p.buttons[7].pressed) firing = true;
      if(p.buttons[0] && p.buttons[0].value>.5 && !padBomb){ padBomb=true; fireBomb(); }
      else if(p.buttons[0] && p.buttons[0].value<=.5) padBomb=false;
      break;
    }
  }
  if(touchMove.id!==null){ const dx=touchMove.x-touchMove.ox, dy=touchMove.y-touchMove.oy, d=len(dx,dy);
    if(d>8){ mx+=dx/Math.max(d,60); my+=dy/Math.max(d,60); } }
  if(touchAim.id!==null){ const dx=touchAim.x-touchAim.ox, dy=touchAim.y-touchAim.oy, d=len(dx,dy);
    if(d>8){ ax+=dx; ay+=dy; firing=true; } else { ax=Math.cos(player.ang); ay=Math.sin(player.ang); firing=true; } }
  if(!ax && !ay){ ax = mouse.x-player.x; ay = mouse.y-player.y; if(mouse.down || autofire) firing = true; }
  const ml = len(mx,my); if(ml>1){ mx/=ml; my/=ml; }
  return {mx,my,ax,ay,firing};
}
let padBomb = false;
let padsOk = true;
let autofire = false;

// ---------------------------------------------------------- catalogue
const WEAPONS = {
  pulse:  {name:'PULSE',   colour:'#63f7ff', rate:.085, dmg:1,   cap:Infinity, blurb:'twin stream'},
  scatter:{name:'SCATTER', colour:'#ffb02e', rate:.30,  dmg:1,   cap:70,  blurb:'nine-shard burst'},
  lance:  {name:'LANCE',   colour:'#ff3fa4', rate:0,    dmg:26,  cap:340, blurb:'continuous beam'},
  swarm:  {name:'SWARM',   colour:'#b8ff3d', rate:.20,  dmg:2.5, cap:90,  blurb:'homing seekers'},
  arc:    {name:'ARC',     colour:'#a98bff', rate:.16,  dmg:1.6, cap:120, blurb:'chains 4 targets'},
  rail:   {name:'RAIL',    colour:'#ffffff', rate:.62,  dmg:9,   cap:32,  blurb:'pierces everything'},
};
const WORDER = ['pulse','scatter','lance','swarm','arc','rail'];

const ETYPE = {
  drifter: {r:15, hp:1,  score:20,  col:'#a06bff', spd:58,  gems:1},
  seeker:  {r:13, hp:1,  score:35,  col:'#63f7ff', spd:132, gems:1},
  weaver:  {r:15, hp:2,  score:60,  col:'#b8ff3d', spd:118, gems:2},
  splitter:{r:24, hp:4,  score:70,  col:'#ffb02e', spd:66,  gems:2},
  shard:   {r:11, hp:1,  score:25,  col:'#ffd98a', spd:150, gems:1},
  serpent: {r:14, hp:7,  score:180, col:'#4dffc3', spd:112, gems:5},
  sentry:  {r:19, hp:5,  score:110, col:'#ff3fa4', spd:34,  gems:3},
  bulwark: {r:21, hp:7,  score:150, col:'#ff7a3d', spd:76,  gems:4},
  singular:{r:24, hp:16, score:400, col:'#ff2d55', spd:16,  gems:8},
};

const POWERS = {
  shield:   {name:'AEGIS',    col:'#63f7ff', blurb:'absorbs 3 hits'},
  overdrive:{name:'OVERDRIVE',col:'#ffb02e', blurb:'double fire rate'},
  timewarp: {name:'STASIS',   col:'#a98bff', blurb:'enemies crawl'},
  magnet:   {name:'LODESTONE',col:'#b8ff3d', blurb:'gems come to you'},
  drones:   {name:'WINGMEN',  col:'#ff3fa4', blurb:'two escort drones'},
  bomb:     {name:'+1 SHOCK', col:'#ffffff', blurb:''},
  life:     {name:'+1 HULL',  col:'#4dffc3', blurb:''},
};

// ---------------------------------------------------------- state
let state = 'menu';         // menu | play | paused | over
let enemies=[], bullets=[], ebullets=[], parts=[], gems=[], drops=[], bolts=[], rings=[];
function loadBest(){ try{ return +(localStorage.getItem('hypergon.best')||0) || 0; }catch(err){ return 0; } }
let score=0, best=loadBest(), mult=1, lives=3, bombs=3;
let sector=1, elapsed=0, spawnT=0, shake=0, hitstop=0, gameT=0, kills=0, spawnBudget=0;
let curW='pulse', ammo={}, fireCd=0, beam=null;
const buffs = { overdrive:0, timewarp:0, magnet:0, drones:0 };
let shieldHits = 0, droneAng = 0, gemBank = 0;
const droneCd = [0,0];

const player = { x:0, y:0, vx:0, vy:0, ang:0, r:12, invuln:0, thrust:0 };

function resetRun(){
  enemies.length=bullets.length=ebullets.length=parts.length=gems.length=drops.length=bolts.length=rings.length=0;
  score=0; mult=1; lives=3; bombs=3; sector=1; elapsed=0; spawnT=1.2; shake=0; kills=0; spawnBudget=0;
  curW='pulse'; fireCd=0; beam=null; shieldHits=0; gemBank=0;
  for(const k in buffs) buffs[k]=0;
  ammo = {}; for(const k in WEAPONS) ammo[k] = (k==='pulse') ? Infinity : 0;
  player.x=W/2; player.y=H/2; player.vx=player.vy=0; player.invuln=2.2;
}

// ---------------------------------------------------------- particles & fx
function spark(x,y,col,count,speed,life=1,size=2.4){
  for(let i=0;i<count;i++){
    const a = rnd(TAU), s = speed*rnd(1,.15);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*rnd(1,.45),max:life,col,size,drag:.965});
  }
}
function ring(x,y,col,r0,r1,life){ rings.push({x,y,col,r:r0,r1,life,max:life}); }

// ---------------------------------------------------------- shooting
function equip(w, amount){
  ammo[w] = Math.min((ammo[w]===Infinity?0:ammo[w]) + amount, WEAPONS[w].cap);
  curW = w; SFX.weapon();
  toast(WEAPONS[w].name, WEAPONS[w].blurb, 1100, WEAPONS[w].colour);
}
function cycleWeapon(dir){
  const owned = WORDER.filter(w => ammo[w] > 0);
  if(owned.length<2) return;
  let i = owned.indexOf(curW); if(i<0) i=0;
  curW = owned[(i+dir+owned.length)%owned.length];
  tone(420,.06,'square',.05,200);
}
const RECOIL = {pulse:5, scatter:150, lance:0, swarm:25, arc:0, rail:0};
function shoot(ax,ay,dt){
  if(ammo[curW] <= 0) curW = 'pulse';
  const w = WEAPONS[curW];
  const rateMul = buffs.overdrive>0 ? .5 : 1;

  if(curW==='lance'){                       // continuous beam, drains while held
    beam = {ax,ay};
    ammo.lance -= dt*60;
    if(ammo.lance<=0){ ammo.lance=0; curW='pulse'; }
    return;
  }
  if(fireCd>0) return;
  fireCd = w.rate*rateMul;
  const spd = buffs.overdrive>0 ? 1.18 : 1;
  const px = player.x + ax*16, py = player.y + ay*16;
  const kick = RECOIL[curW] || 0;
  player.vx -= ax*kick; player.vy -= ay*kick;

  switch(curW){
    case 'pulse': {
      for(const off of [-5,5]){
        const nx = -ay, ny = ax;
        bullets.push(mkBullet(px+nx*off, py+ny*off, ax*1180*spd, ay*1180*spd, w.dmg, 3, w.colour, 1));
      }
      SFX.shoot(); break;
    }
    case 'scatter': {
      for(let i=0;i<9;i++){
        const a = Math.atan2(ay,ax) + rnd(.30,-.30);
        bullets.push(mkBullet(px,py,Math.cos(a)*rnd(1080,780)*spd,Math.sin(a)*rnd(1080,780)*spd,w.dmg,3,w.colour,1,.45));
      }
      ammo.scatter--; tone(180,.14,'square',.06,-90); noise(.1,.07); break;
    }
    case 'swarm': {
      for(const off of [-14,14]){
        const nx=-ay, ny=ax;
        const b = mkBullet(px+nx*off,py+ny*off, ax*380+nx*off*9, ay*380+ny*off*9, w.dmg, 4, w.colour, 1, 2.4);
        b.homing = true; bullets.push(b);
      }
      ammo.swarm--; tone(880,.1,'sine',.04,-320); break;
    }
    case 'arc': {
      ammo.arc--; SFX.arc(); chainLightning(ax,ay,w.dmg); break;
    }
    case 'rail': {
      const b = mkBullet(px,py, ax*2600, ay*2600, w.dmg, 7, '#ffffff', 99, 1.1);
      b.rail = true; bullets.push(b);
      ammo.rail--; SFX.rail(); shake=Math.max(shake,9);
      player.vx -= ax*420; player.vy -= ay*420;
      gridImpulse(px,py,14,280);
      break;
    }
  }
}
function mkBullet(x,y,vx,vy,dmg,r,col,pierce,life=1.6){
  return {x,y,vx,vy,dmg,r,col,pierce,life,homing:false,rail:false,px:x,py:y};
}
function chainLightning(ax,ay,dmg){
  const pts=[{x:player.x,y:player.y}];
  let from = player, hitIds = new Set(), hops = 0;
  let reach = 460;
  while(hops<4){
    let best=null, bd=reach*reach;
    for(const e of enemies){
      if(e.dead || hitIds.has(e)) continue;
      const dx=e.x-from.x, dy=e.y-from.y, d2=dx*dx+dy*dy;
      if(hops===0){ const a=Math.atan2(dy,dx); if(Math.abs(angDiff(a,Math.atan2(ay,ax)))>0.9) continue; }
      if(d2<bd){ bd=d2; best=e; }
    }
    if(!best) break;
    hitIds.add(best); pts.push({x:best.x,y:best.y});
    damage(best, dmg*(1-hops*0.12));
    spark(best.x,best.y,'#d5c6ff',6,220,.4,2);
    from = best; reach = 300; hops++;
  }
  if(pts.length>1) bolts.push({pts,life:.16,max:.16,col:'#c9b4ff'});
}

function fireBomb(){
  if(state!=='play' || bombs<=0) return;
  bombs--; SFX.bomb(); shake = 26; hitstop = .08;
  gridImpulse(player.x,player.y,34,Math.max(W,H));
  ring(player.x,player.y,'#ffffff',30,Math.max(W,H)*.8,.75);
  ring(player.x,player.y,'#63f7ff',10,Math.max(W,H)*.55,1.0);
  for(const e of enemies) if(!e.dead) killEnemy(e, true);
  ebullets.length = 0;
  spark(player.x,player.y,'#ffffff',90,700,1.1,3);
}

// ---------------------------------------------------------- enemies
function spawnEnemy(type, x, y){
  const t = ETYPE[type];
  const e = { type, x, y, vx:0, vy:0, r:t.r, hp:t.hp, maxhp:t.hp, col:t.col, spd:t.spd,
              ang:rnd(TAU), spin:rnd(2.4,-2.4), dead:false, birth:.55, flash:0, wob:rnd(TAU) };
  if(type==='serpent'){
    e.segs = []; for(let i=0;i<9;i++) e.segs.push({x,y});
  }
  if(type==='sentry'){ e.cd = rnd(1.6,.6); }
  if(type==='bulwark'){ e.sa = rnd(TAU); }
  if(type==='singular'){ e.grow = 0; e.pulse = 0; }
  if(type==='splitter'){ e.gen = 0; }
  enemies.push(e);
  ring(x,y,t.col,t.r*3.4,t.r*.6,.5);
  return e;
}
function safeSpawnPoint(){
  for(let i=0;i<24;i++){
    const x = rnd(W-90,90), y = rnd(H-90,90);
    if(len(x-player.x,y-player.y) > 230) return [x,y];
  }
  return [rnd(W-90,90), rnd(H-90,90)];
}

function damage(e, amount){
  if(e.dead || e.birth>0) return;
  e.hp -= amount; e.flash = .12;
  if(e.type==='singular'){ e.grow += amount*.7; }
  if(e.hp<=0) killEnemy(e,false);
  else spark(e.x,e.y,e.col,3,140,.28,1.8);
}
function killEnemy(e, byBomb){
  if(e.dead) return;
  e.dead = true;
  const t = ETYPE[e.type];
  const gained = t.score * mult;
  score += gained; kills++;
  spark(e.x,e.y,e.col,e.type==='singular'?70:18+e.r,e.type==='singular'?520:300,.85,2.6);
  gridImpulse(e.x,e.y,e.type==='singular'?30:7, e.r*9);
  ring(e.x,e.y,e.col,e.r*.8,e.r*4.5,.35);
  shake = Math.max(shake, e.r*.22);
  if(e.type==='singular'){ SFX.big(); shake=Math.max(shake,18);
    for(let i=0;i<9;i++){ const a=i/9*TAU; spawnEnemy('shard', e.x+Math.cos(a)*46, e.y+Math.sin(a)*46); }
  } else SFX.pop();

  if(e.type==='splitter' && e.gen<2){
    const n = e.gen===0?3:2, nr = e.gen===0?1:2;
    for(let i=0;i<n;i++){
      const a = rnd(TAU);
      const c = spawnEnemy('splitter', e.x+Math.cos(a)*22, e.y+Math.sin(a)*22);
      c.gen = e.gen+1; c.r = ETYPE.splitter.r/(1+c.gen); c.hp = c.maxhp = Math.max(1, 4-c.gen*2);
      c.spd = ETYPE.splitter.spd*(1+c.gen*.45); c.birth = .18;
    }
  }
  // loot
  const gn = byBomb ? Math.ceil(t.gems/2) : t.gems;
  for(let i=0;i<gn;i++){
    const a=rnd(TAU), s=rnd(190,60);
    gems.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:9,ang:rnd(TAU)});
  }
  if(!byBomb){
    const roll = Math.random();
    if(roll < .045) dropCrate(e.x,e.y,'weapon');
    else if(roll < .10) dropCrate(e.x,e.y,'power');
  }
}
function dropCrate(x,y,kind){
  let key;
  if(kind==='weapon') key = pick(['scatter','lance','swarm','arc','rail']);
  else {
    const pool = ['shield','overdrive','timewarp','magnet','drones','bomb'];
    if(lives<4 && Math.random()<.12) pool.push('life','life');
    key = pick(pool);
  }
  drops.push({x,y,vx:rnd(60,-60),vy:rnd(60,-60),kind,key,life:14,ang:0,bob:rnd(TAU)});
}

// ---------------------------------------------------------- director
function director(dt){
  elapsed += dt;
  const newSector = 1 + Math.floor(elapsed/40);
  if(newSector !== sector){
    sector = newSector;
    toast('SECTOR '+String(sector).padStart(2,'0'), sectorName(sector), 1400, '#63f7ff');
    tone(220,.5,'sine',.07,180);
    if(sector%3===0){ bombs = Math.min(bombs+1,5); }
  }
  const diff = 1 + elapsed/34;
  spawnBudget += dt * (0.9 + elapsed/50);
  spawnT -= dt;
  if(spawnT<=0 && enemies.length < 150){
    spawnT = clamp(2.0 - elapsed/70, .38, 2.0) * rnd(1.25,.75);
    const unlocked = ['drifter','seeker'];
    if(elapsed>18) unlocked.push('weaver');
    if(elapsed>36) unlocked.push('splitter');
    if(elapsed>58) unlocked.push('sentry');
    if(elapsed>80) unlocked.push('serpent');
    if(elapsed>104) unlocked.push('bulwark');
    const type = pick(unlocked);
    const group = clamp(Math.round(rnd(diff*1.6, 1)), 1, 9);
    if(Math.random()<.22){                    // formation burst
      const [cx,cy] = safeSpawnPoint();
      const rr = 60+group*7;
      for(let i=0;i<group;i++){ const a=i/group*TAU; spawnEnemy(type, clamp(cx+Math.cos(a)*rr,40,W-40), clamp(cy+Math.sin(a)*rr,40,H-40)); }
    } else {
      for(let i=0;i<group;i++){ const [x,y]=safeSpawnPoint(); spawnEnemy(type,x,y); }
    }
    if(elapsed>66 && Math.random()<.09 && enemies.filter(e=>e.type==='singular').length<2){
      const [x,y]=safeSpawnPoint(); spawnEnemy('singular',x,y);
      toast('SINGULARITY','it eats the grid',1100,'#ff2d55');
    }
  }
}
function sectorName(n){
  const names=['first light','the swarm thickens','shard rain','deep static','collapse','event horizon','no more mercy'];
  return names[Math.min(n-1,names.length-1)];
}

// ---------------------------------------------------------- update
function update(dt){
  gameT += dt;
  const ets = buffs.timewarp>0 ? .32 : 1;   // enemy time scale
  for(const k in buffs) if(buffs[k]>0) buffs[k] = Math.max(0, buffs[k]-dt);

  // ---- player
  const st = readSticks();
  const accel = 2400;
  player.vx += st.mx*accel*dt; player.vy += st.my*accel*dt;
  const fr = Math.pow(.003, dt);
  player.vx *= fr; player.vy *= fr;
  const sp = len(player.vx,player.vy), maxSp = 560;
  if(sp>maxSp){ player.vx = player.vx/sp*maxSp; player.vy = player.vy/sp*maxSp; }
  player.x += player.vx*dt; player.y += player.vy*dt;
  if(player.x<16){ player.x=16; player.vx=Math.abs(player.vx)*.4; gridImpulse(player.x,player.y,4,170); }
  if(player.x>W-16){ player.x=W-16; player.vx=-Math.abs(player.vx)*.4; gridImpulse(player.x,player.y,4,170); }
  if(player.y<16){ player.y=16; player.vy=Math.abs(player.vy)*.4; gridImpulse(player.x,player.y,4,170); }
  if(player.y>H-16){ player.y=H-16; player.vy=-Math.abs(player.vy)*.4; gridImpulse(player.x,player.y,4,170); }
  player.thrust = Math.min(1, sp/420);
  gridImpulse(player.x, player.y, -0.45 - player.thrust*0.7, 130);
  if(player.invuln>0) player.invuln -= dt;

  const [ax,ay] = norm(st.ax||1, st.ay||0);
  player.ang = Math.atan2(ay,ax);
  fireCd -= dt; beam = null;
  if(st.firing) shoot(ax,ay,dt);

  // engine trail
  if(sp>60 && Math.random()<.85){
    const [nx,ny] = norm(-player.vx,-player.vy);
    parts.push({x:player.x+nx*10, y:player.y+ny*10, vx:nx*rnd(180,60)+rnd(50,-50), vy:ny*rnd(180,60)+rnd(50,-50),
      life:rnd(.36,.14), max:.36, col: buffs.overdrive>0?'#ffb02e':'#63f7ff', size:2, drag:.93});
  }

  // ---- drones
  droneAng += dt*2.1;
  if(buffs.drones>0){
    for(let d=0; d<2; d++){
      const a = droneAng + d*Math.PI;
      const dx = player.x + Math.cos(a)*58, dy = player.y + Math.sin(a)*58;
      droneCd[d] -= dt;
      if(droneCd[d]<=0){
        let best=null, bd=1e9;
        for(const e of enemies){ if(e.dead||e.birth>0) continue; const q=(e.x-dx)**2+(e.y-dy)**2; if(q<bd){bd=q;best=e;} }
        if(best && bd < 560*560){
          droneCd[d] = .30;
          const [bx,by] = norm(best.x-dx, best.y-dy);
          bullets.push(mkBullet(dx,dy,bx*980,by*980,.9,2.4,'#ff8fd0',1,1.1));
          tone(1280,.03,'square',.02,-300);
        }
      }
    }
  }

  // ---- beam (LANCE)
  if(beam){
    const bx = beam.ax, by = beam.ay;
    let end = 2400;
    for(const e of enemies){
      if(e.dead||e.birth>0) continue;
      const dx=e.x-player.x, dy=e.y-player.y;
      const t = dx*bx+dy*by; if(t<0||t>end) continue;
      const perp = Math.abs(dx*by - dy*bx);
      if(perp < e.r+9){
        damage(e, WEAPONS.lance.dmg*dt);
        e.vx += bx*90*dt*60/60; e.vy += by*90*dt*60/60;
        if(Math.random()<.5) spark(e.x,e.y,'#ff8fd0',1,120,.2,1.6);
      }
    }
    for(let i=ebullets.length-1;i>=0;i--){
      const b=ebullets[i], dx=b.x-player.x, dy=b.y-player.y, t=dx*bx+dy*by;
      if(t>0 && t<end && Math.abs(dx*by-dy*bx)<12){ spark(b.x,b.y,'#ff3fa4',5,180,.3,2); ebullets.splice(i,1); }
    }
    for(let s=40;s<1600;s+=90) gridImpulse(player.x+bx*s, player.y+by*s, -0.35, 70);
    if(Math.random()<.4) tone(rnd(320,240),.05,'sawtooth',.02,60);
  }

  // ---- bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    if(!b) break;
    b.px=b.x; b.py=b.y;
    if(b.homing){
      let best=null, bd=420*420;
      for(const e of enemies){ if(e.dead||e.birth>0) continue; const q=(e.x-b.x)**2+(e.y-b.y)**2; if(q<bd){bd=q;best=e;} }
      if(best){
        const [tx,ty] = norm(best.x-b.x, best.y-b.y);
        b.vx = lerp(b.vx, tx*760, 1-Math.pow(.0007,dt));
        b.vy = lerp(b.vy, ty*760, 1-Math.pow(.0007,dt));
      } else { b.vx*=1.012; b.vy*=1.012; }
      if(Math.random()<.7) parts.push({x:b.x,y:b.y,vx:rnd(40,-40),vy:rnd(40,-40),life:.25,max:.25,col:'#b8ff3d',size:1.6,drag:.9});
    }
    b.x += b.vx*dt; b.y += b.vy*dt;
    b.life -= dt;
    if(b.rail){ gridImpulse(b.x,b.y,1.4,120); if(Math.random()<.9) parts.push({x:b.x,y:b.y,vx:rnd(90,-90),vy:rnd(90,-90),life:.3,max:.3,col:'#dff3ff',size:2,drag:.9}); }
    if(b.life<=0 || b.x<-40||b.x>W+40||b.y<-40||b.y>H+40){ bullets.splice(i,1); continue; }
    // vs enemies
    for(const e of enemies){
      if(e.dead || e.birth>0) continue;
      const dx=e.x-b.x, dy=e.y-b.y;
      if(dx*dx+dy*dy > (e.r+b.r)**2) continue;
      if(e.type==='bulwark'){                       // rotating shield deflects
        const a = Math.atan2(-dy,-dx);
        if(Math.abs(angDiff(a, e.sa)) < 1.15 && !b.rail){
          const [nx,ny] = norm(-dx,-dy);
          b.vx = nx*760+rnd(160,-160); b.vy = ny*760+rnd(160,-160); b.life=Math.min(b.life,.5);
          spark(b.x,b.y,'#ff7a3d',4,180,.25,2); tone(900,.04,'square',.03,-400);
          continue;
        }
      }
      damage(e, b.dmg);
      e.vx += b.vx*.045; e.vy += b.vy*.045;
      b.pierce--;
      if(b.pierce<=0){ spark(b.x,b.y,b.col,4,180,.25,2); bullets.splice(i,1); break; }
    }
  }

  // ---- enemy bullets
  for(let i=ebullets.length-1;i>=0;i--){
    const b = ebullets[i];
    if(!b) break;                      // hurtPlayer() can wipe the array mid-loop
    b.x += b.vx*dt*ets; b.y += b.vy*dt*ets; b.life -= dt;
    if(b.life<=0 || b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){ ebullets.splice(i,1); continue; }
    if(hitPlayer(b.x,b.y,b.r)){ ebullets.splice(i,1); hurtPlayer(); continue; }
    for(let j=bullets.length-1;j>=0;j--){          // shoot them down
      const p=bullets[j];
      if((p.x-b.x)**2+(p.y-b.y)**2 < (b.r+p.r+2)**2){
        spark(b.x,b.y,'#ff3fa4',6,200,.3,2); ebullets.splice(i,1);
        if(--p.pierce<=0) bullets.splice(j,1);
        break;
      }
    }
  }

  // ---- enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(e.dead){ enemies.splice(i,1); continue; }
    if(e.birth>0){ e.birth -= dt; continue; }
    e.flash = Math.max(0, e.flash-dt);
    e.ang += e.spin*dt*ets;
    const [tx,ty] = norm(player.x-e.x, player.y-e.y);
    const d = len(player.x-e.x, player.y-e.y);

    switch(e.type){
      case 'drifter': {
        e.wob += dt*ets*1.4;
        e.vx += Math.cos(e.wob*1.3)*40*dt*ets; e.vy += Math.sin(e.wob)*40*dt*ets;
        break;
      }
      case 'seeker': case 'shard': {
        e.vx += tx*e.spd*3.2*dt*ets; e.vy += ty*e.spd*3.2*dt*ets;
        break;
      }
      case 'weaver': {                              // dodges incoming fire
        let dx=tx, dy=ty;
        for(const b of bullets){
          const q=(b.x-e.x)**2+(b.y-e.y)**2;
          if(q<150*150){ const [fx,fy]=norm(e.x-b.x,e.y-b.y); dx+=fx*2.6; dy+=fy*2.6; }
        }
        const [nx,ny]=norm(dx,dy);
        e.vx += nx*e.spd*3.4*dt*ets; e.vy += ny*e.spd*3.4*dt*ets;
        break;
      }
      case 'splitter': {
        e.vx += tx*e.spd*2.2*dt*ets; e.vy += ty*e.spd*2.2*dt*ets;
        break;
      }
      case 'serpent': {
        e.wob += dt*ets*3.2;
        const perpx=-ty, perpy=tx, s=Math.sin(e.wob)*.9;
        e.vx += (tx+perpx*s)*e.spd*3.0*dt*ets; e.vy += (ty+perpy*s)*e.spd*3.0*dt*ets;
        let px=e.x, py=e.y;
        for(const sg of e.segs){
          const dx=px-sg.x, dy=py-sg.y, dd=len(dx,dy);
          if(dd>17){ sg.x += dx*(1-17/dd); sg.y += dy*(1-17/dd); }
          px=sg.x; py=sg.y;
        }
        break;
      }
      case 'sentry': {
        const ideal = 300;
        const push = d<ideal ? -1 : 1;
        e.vx += tx*e.spd*3*dt*ets*push; e.vy += ty*e.spd*3*dt*ets*push;
        e.vx += -ty*e.spd*2*dt*ets; e.vy += tx*e.spd*2*dt*ets;
        e.cd -= dt*ets;
        if(e.cd<=0 && d<680){
          e.cd = rnd(2.4,1.5);
          for(let k=-1;k<=1;k++){
            const a = Math.atan2(ty,tx)+k*.20;
            ebullets.push({x:e.x+Math.cos(a)*20,y:e.y+Math.sin(a)*20,vx:Math.cos(a)*300,vy:Math.sin(a)*300,r:6,life:5,col:'#ff3fa4'});
          }
          tone(160,.16,'sawtooth',.04,-60);
        }
        break;
      }
      case 'bulwark': {
        e.sa += dt*ets*1.15;
        e.vx += tx*e.spd*2.4*dt*ets; e.vy += ty*e.spd*2.4*dt*ets;
        break;
      }
      case 'singular': {
        e.pulse += dt*ets;
        e.r = ETYPE.singular.r + Math.min(e.grow*1.6, 26) + Math.sin(e.pulse*4)*1.6;
        e.vx += tx*e.spd*2*dt*ets; e.vy += ty*e.spd*2*dt*ets;
        const R = 460 + e.grow*8;
        gridImpulse(e.x,e.y, -(0.55 + e.grow*.035), R);
        // suck everything in
        const pull = (o, strength) => {
          const dx=e.x-o.x, dy=e.y-o.y, dd=Math.max(28,len(dx,dy));
          if(dd<R){ const f=strength*(1-dd/R)/dd; o.vx += dx*f*dt*60; o.vy += dy*f*dt*60; }
        };
        pull(player, 3.4);
        for(const g of gems) pull(g, 12);
        for(const b of bullets) if(!b.rail) pull(b, 1.2);
        for(const o of enemies) if(o!==e && !o.dead) pull(o, .9);
        if(Math.random()<.55){
          const a=rnd(TAU), rr=R*rnd(1,.35);
          parts.push({x:e.x+Math.cos(a)*rr, y:e.y+Math.sin(a)*rr, vx:-Math.cos(a)*rr*1.6, vy:-Math.sin(a)*rr*1.6,
                      life:.6,max:.6,col:'#ff2d55',size:1.8,drag:.99});
        }
        break;
      }
    }
    const es = len(e.vx,e.vy), cap = e.spd*1.9;
    if(es>cap){ e.vx=e.vx/es*cap; e.vy=e.vy/es*cap; }
    e.vx *= Math.pow(.30,dt); e.vy *= Math.pow(.30,dt);
    e.x += e.vx*dt*ets; e.y += e.vy*dt*ets;

    // arena walls
    if(e.x<e.r){ e.x=e.r; e.vx=Math.abs(e.vx); } if(e.x>W-e.r){ e.x=W-e.r; e.vx=-Math.abs(e.vx); }
    if(e.y<e.r){ e.y=e.r; e.vy=Math.abs(e.vy); } if(e.y>H-e.r){ e.y=H-e.r; e.vy=-Math.abs(e.vy); }
    gridImpulse(e.x,e.y, e.type==='singular'?0:-0.22, e.r*3.6);

    // vs player
    if(hitPlayer(e.x,e.y,e.r)) hurtPlayer();
    else if(e.segs){ for(const sg of e.segs) if(hitPlayer(sg.x,sg.y,10)){ hurtPlayer(); break; } }
  }

  // ---- gems
  const magR = buffs.magnet>0 ? 1e4 : 165;
  for(let i=gems.length-1;i>=0;i--){
    const g = gems[i];
    const dx=player.x-g.x, dy=player.y-g.y, d=len(dx,dy);
    if(d<magR){ const f=(buffs.magnet>0?1500:900)/Math.max(d,32); g.vx += dx/d*f*dt*6; g.vy += dy/d*f*dt*6; }
    g.vx*=Math.pow(.22,dt); g.vy*=Math.pow(.22,dt);
    g.x+=g.vx*dt; g.y+=g.vy*dt; g.life-=dt; g.ang+=dt*3;
    g.x=clamp(g.x,8,W-8); g.y=clamp(g.y,8,H-8);
    if(d < player.r+14){
      gems.splice(i,1); gemBank++; score += 2*mult;
      SFX.gem();
      spark(g.x,g.y,'#b8ff3d',3,120,.25,1.6);
      const need = Math.ceil(mult/10);        // steps get dearer as you climb
      if(gemBank >= need && mult < 150){
        gemBank -= need; mult++;
        if(mult%25===0) toast('×'+mult,'multiplier',700,'#b8ff3d');
      }
      continue;
    }
    if(g.life<=0) gems.splice(i,1);
  }

  // ---- drops
  for(let i=drops.length-1;i>=0;i--){
    const p = drops[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=Math.pow(.25,dt); p.vy*=Math.pow(.25,dt);
    p.life-=dt; p.ang+=dt*1.6; p.bob+=dt*4;
    p.x=clamp(p.x,24,W-24); p.y=clamp(p.y,24,H-24);
    gridImpulse(p.x,p.y,-0.28,64);
    if(len(player.x-p.x,player.y-p.y) < player.r+22){
      collect(p); drops.splice(i,1); continue;
    }
    if(p.life<=0) drops.splice(i,1);
  }

  // ---- fx
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    const dm = Math.pow(p.drag, dt*60); p.vx*=dm; p.vy*=dm;
  }
  for(let i=rings.length-1;i>=0;i--){ const r=rings[i]; r.life-=dt; if(r.life<=0) rings.splice(i,1); }
  for(let i=bolts.length-1;i>=0;i--){ const b=bolts[i]; b.life-=dt; if(b.life<=0) bolts.splice(i,1); }

  updateGrid(dt);
  director(dt);
  shake = Math.max(0, shake - dt*46);
}

function hitPlayer(x,y,r){
  if(player.invuln>0) return false;
  return (x-player.x)**2 + (y-player.y)**2 < (r+player.r)**2;
}
function hurtPlayer(){
  if(player.invuln>0) return;
  if(shieldHits>0){
    shieldHits--; player.invuln = .7; shake=Math.max(shake,10);
    ring(player.x,player.y,'#63f7ff',18,190,.4);
    spark(player.x,player.y,'#63f7ff',26,340,.5,2.4);
    gridImpulse(player.x,player.y,12,300);
    tone(700,.2,'sine',.08,-420);
    return;
  }
  lives--; player.invuln = 2.6; mult = 1; gemBank = 0;
  SFX.death(); shake = 32; hitstop = .13;
  spark(player.x,player.y,'#ffffff',80,560,1.1,3);
  ring(player.x,player.y,'#ffffff',20,420,.6);
  gridImpulse(player.x,player.y,26,Math.max(W,H)*.6);
  for(const e of enemies) if(!e.dead && len(e.x-player.x,e.y-player.y)<300) killEnemy(e,true);
  ebullets.length = 0;
  player.vx=player.vy=0;
  if(lives<=0) gameOver();
}
function collect(p){
  if(p.kind==='weapon'){ equip(p.key, WEAPONS[p.key].cap); return; }
  const meta = POWERS[p.key];
  SFX.power();
  spark(p.x,p.y,meta.col,24,300,.6,2.4);
  ring(p.x,p.y,meta.col,10,150,.4);
  switch(p.key){
    case 'shield': shieldHits = 3; break;
    case 'overdrive': buffs.overdrive = 12; break;
    case 'timewarp': buffs.timewarp = 9; break;
    case 'magnet': buffs.magnet = 14; break;
    case 'drones': buffs.drones = 16; break;
    case 'bomb': bombs = Math.min(bombs+1, 5); break;
    case 'life': lives = Math.min(lives+1, 5); break;
  }
  toast(meta.name, meta.blurb, 1000, meta.col);
}

// ---------------------------------------------------------- drawing helpers
function stroke2(col, w, a){
  a = a===undefined ? 1 : a;
  ctx.strokeStyle = col;
  ctx.globalAlpha = .20*a; ctx.lineWidth = w*3.4; ctx.stroke();
  ctx.globalAlpha = a;     ctx.lineWidth = w;     ctx.stroke();
  ctx.globalAlpha = 1;
}
function polyPath(x,y,n,r,rot){
  ctx.beginPath();
  for(let i=0;i<n;i++){ const a = rot + i/n*TAU; const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.closePath();
}
function starPath(x,y,n,r1,r2,rot){
  ctx.beginPath();
  for(let i=0;i<n*2;i++){ const a=rot+i/(n*2)*TAU, r=i%2?r2:r1;
    const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.closePath();
}

function drawEnemy(e){
  const col = e.flash>0 ? '#ffffff' : e.col;
  if(e.birth>0){
    const t = 1-e.birth/.55;
    ctx.globalAlpha = t*.9;
    polyPath(e.x,e.y,6,e.r*(2.6-t*1.6),e.ang);
    ctx.strokeStyle=e.col; ctx.lineWidth=1.4; ctx.stroke();
    ctx.globalAlpha=1;
    return;
  }
  const hpf = e.hp/e.maxhp;
  switch(e.type){
    case 'drifter': {
      polyPath(e.x,e.y,4,e.r,e.ang); stroke2(col,2.2);
      polyPath(e.x,e.y,4,e.r*.5,-e.ang*1.6); stroke2(col,1.4);
      break;
    }
    case 'seeker': case 'shard': {
      ctx.beginPath();
      const a=Math.atan2(e.vy,e.vx)||e.ang;
      ctx.moveTo(e.x+Math.cos(a)*e.r*1.5, e.y+Math.sin(a)*e.r*1.5);
      ctx.lineTo(e.x+Math.cos(a+2.5)*e.r, e.y+Math.sin(a+2.5)*e.r);
      ctx.lineTo(e.x+Math.cos(a-2.5)*e.r, e.y+Math.sin(a-2.5)*e.r);
      ctx.closePath(); stroke2(col,2.2);
      break;
    }
    case 'weaver': {
      starPath(e.x,e.y,3,e.r*1.35,e.r*.55,e.ang); stroke2(col,2.2);
      break;
    }
    case 'splitter': {
      polyPath(e.x,e.y,6,e.r,e.ang); stroke2(col,2.4);
      polyPath(e.x,e.y,3,e.r*.55,-e.ang); stroke2(col,1.6);
      break;
    }
    case 'serpent': {
      ctx.beginPath(); ctx.moveTo(e.x,e.y);
      for(const s of e.segs) ctx.lineTo(s.x,s.y);
      ctx.strokeStyle=col; ctx.globalAlpha=.2; ctx.lineWidth=20; ctx.lineCap='round'; ctx.stroke();
      ctx.globalAlpha=1; ctx.lineWidth=3.4; ctx.stroke(); ctx.lineCap='butt';
      polyPath(e.x,e.y,3,e.r,Math.atan2(e.vy,e.vx)); stroke2('#ffffff',2);
      for(let i=0;i<e.segs.length;i+=2){ const s=e.segs[i];
        polyPath(s.x,s.y,4,7-(i*.35),e.ang+i); stroke2(col,1.3); }
      break;
    }
    case 'sentry': {
      polyPath(e.x,e.y,5,e.r,e.ang*.4); stroke2(col,2.4);
      const a = Math.atan2(player.y-e.y, player.x-e.x);
      ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x+Math.cos(a)*e.r*1.7, e.y+Math.sin(a)*e.r*1.7);
      stroke2(col,2.6);
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r*.42,0,TAU); stroke2('#ffffff',1.4);
      break;
    }
    case 'bulwark': {
      polyPath(e.x,e.y,6,e.r,e.ang*.3); stroke2(col,2.4);
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r+11, e.sa-1.15, e.sa+1.15); stroke2('#ffe0b8',3);
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r+6, e.sa-1.0, e.sa+1.0); stroke2(col,1.6);
      break;
    }
    case 'singular': {
      const R = e.r;
      ctx.beginPath(); ctx.arc(e.x,e.y,R,0,TAU);
      ctx.fillStyle = '#05060f'; ctx.fill(); stroke2(col,3);
      for(let i=1;i<=3;i++){
        ctx.beginPath();
        ctx.ellipse(e.x,e.y, R+i*16+Math.sin(e.pulse*3+i)*4, R+i*9, e.pulse*.6+i, 0, TAU);
        ctx.globalAlpha=.35/i; ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.stroke(); ctx.globalAlpha=1;
      }
      break;
    }
  }
  if(e.maxhp>2 && hpf<1 && e.type!=='singular'){
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r+5,-Math.PI/2,-Math.PI/2+TAU*hpf);
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1.6; ctx.stroke();
  }
}

function drawPlayer(){
  if(lives<=0) return;
  const blink = player.invuln>0 && (Math.floor(gameT*18)%2===0);
  ctx.save();
  ctx.translate(player.x,player.y); ctx.rotate(player.ang);
  if(!blink){
    // hull
    ctx.beginPath();
    ctx.moveTo(19,0); ctx.lineTo(-9,11); ctx.lineTo(-4,0); ctx.lineTo(-9,-11); ctx.closePath();
    stroke2('#eaf6ff',2.4);
    ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(-3,5); ctx.lineTo(-3,-5); ctx.closePath();
    stroke2(WEAPONS[curW].colour,1.8);
    // thrust
    if(player.thrust>.05){
      ctx.beginPath(); ctx.moveTo(-6,4); ctx.lineTo(-10-player.thrust*20*rnd(1,.6),0); ctx.lineTo(-6,-4);
      stroke2(buffs.overdrive>0?'#ffb02e':'#63f7ff',2);
    }
  }
  ctx.restore();
  // shield
  if(shieldHits>0){
    for(let i=0;i<shieldHits;i++){
      ctx.beginPath(); ctx.arc(player.x,player.y, 24+i*5, gameT*(1.4+i*.6), gameT*(1.4+i*.6)+TAU*.7);
      ctx.strokeStyle='#63f7ff'; ctx.globalAlpha=.55; ctx.lineWidth=2; ctx.stroke(); ctx.globalAlpha=1;
    }
  }
  // drones
  if(buffs.drones>0){
    for(let d=0;d<2;d++){
      const a = droneAng+d*Math.PI, dx=player.x+Math.cos(a)*58, dy=player.y+Math.sin(a)*58;
      polyPath(dx,dy,3,8,gameT*4+d); stroke2('#ff8fd0',1.8);
    }
  }
  // magnet field
  if(buffs.magnet>0){
    ctx.beginPath(); ctx.arc(player.x,player.y, 40+Math.sin(gameT*3)*6, 0, TAU);
    ctx.strokeStyle='#b8ff3d'; ctx.globalAlpha=.2; ctx.lineWidth=1.4; ctx.stroke(); ctx.globalAlpha=1;
  }
}

function render(){
  // background
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = buffs.timewarp>0 ? '#080614' : '#05060f';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0.2) ctx.translate(rnd(shake,-shake), rnd(shake,-shake));

  drawGrid();

  // arena frame
  ctx.beginPath(); ctx.rect(2,2,W-4,H-4);
  ctx.strokeStyle='rgba(99,247,255,.28)'; ctx.lineWidth=2; ctx.stroke();

  ctx.globalCompositeOperation = 'lighter';

  // rings
  for(const r of rings){
    const t = 1-r.life/r.max;
    ctx.beginPath(); ctx.arc(r.x,r.y, lerp(r.r,r.r1,t*t), 0, TAU);
    ctx.strokeStyle=r.col; ctx.globalAlpha=(1-t)*.8; ctx.lineWidth=lerp(5,.6,t); ctx.stroke(); ctx.globalAlpha=1;
  }
  // gems
  for(const g of gems){
    const fade = g.life<2 ? (Math.floor(g.life*10)%2?.25:1) : 1;
    polyPath(g.x,g.y,4,8,g.ang); stroke2('#b8ff3d',1.8,fade);
  }
  // drops
  for(const p of drops){
    const meta = p.kind==='weapon' ? WEAPONS[p.key] : POWERS[p.key];
    const col = meta.colour || meta.col;
    const bob = Math.sin(p.bob)*3, fade = p.life<3 ? (Math.floor(p.life*8)%2?.3:1) : 1;
    if(p.kind==='weapon'){ polyPath(p.x,p.y+bob,6,15,p.ang); stroke2(col,2.2,fade); polyPath(p.x,p.y+bob,6,8,-p.ang*1.4); stroke2(col,1.4,fade); }
    else { starPath(p.x,p.y+bob,5,16,7,p.ang); stroke2(col,2.2,fade); }
    ctx.font='600 9px Chakra Petch, sans-serif'; ctx.textAlign='center';
    ctx.fillStyle=col; ctx.globalAlpha=.85;
    ctx.fillText((meta.name||'').slice(0,9), p.x, p.y+bob+30); ctx.globalAlpha=1;
  }
  // particles
  for(const p of parts){
    const t = p.life/p.max;
    ctx.globalAlpha = clamp(t,0,1)*.95;
    ctx.strokeStyle = p.col; ctx.lineWidth = p.size*t+.4;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*.016, p.y-p.vy*.016); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // enemy bullets
  for(const b of ebullets){
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); stroke2(b.col,2);
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*.4,0,TAU); ctx.fillStyle='#fff'; ctx.globalAlpha=.7; ctx.fill(); ctx.globalAlpha=1;
  }
  // enemies
  for(const e of enemies) drawEnemy(e);
  // bullets
  for(const b of bullets){
    ctx.beginPath(); ctx.moveTo(b.px,b.py); ctx.lineTo(b.x,b.y);
    stroke2(b.col, b.rail?5:2.4);
  }
  // lightning
  for(const bl of bolts){
    const t = bl.life/bl.max;
    ctx.globalAlpha = t;
    ctx.beginPath();
    for(let i=0;i<bl.pts.length-1;i++){
      const a=bl.pts[i], b=bl.pts[i+1];
      ctx.moveTo(a.x,a.y);
      const steps=5;
      for(let s=1;s<=steps;s++){
        const f=s/steps, jx=(s<steps)?rnd(16,-16):0, jy=(s<steps)?rnd(16,-16):0;
        ctx.lineTo(lerp(a.x,b.x,f)+jx, lerp(a.y,b.y,f)+jy);
      }
    }
    stroke2(bl.col,2.6);
    ctx.globalAlpha=1;
  }
  // lance beam
  if(beam){
    const {ax,ay} = beam;
    ctx.beginPath(); ctx.moveTo(player.x+ax*14, player.y+ay*14);
    ctx.lineTo(player.x+ax*2400, player.y+ay*2400);
    ctx.strokeStyle='#ff3fa4'; ctx.globalAlpha=.22; ctx.lineWidth=26+Math.sin(gameT*40)*5; ctx.stroke();
    ctx.globalAlpha=.55; ctx.lineWidth=9; ctx.stroke();
    ctx.globalAlpha=1; ctx.strokeStyle='#ffe6f5'; ctx.lineWidth=3; ctx.stroke();
  }

  drawPlayer();

  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  if(bloomOn){
    bctx.setTransform(1,0,0,1,0,0);
    bctx.clearRect(0,0,bloomC.width,bloomC.height);
    bctx.filter = 'blur(2.5px)';
    bctx.drawImage(cvs, 0,0, bloomC.width, bloomC.height);
    bctx.filter = 'none';
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = .55;
    ctx.drawImage(bloomC, 0,0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}

// ---------------------------------------------------------- HUD
const $ = id => document.getElementById(id);
const el = { score:$('score'), mult:$('mult'), wave:$('wave'), pips:$('pips'),
             wname:$('wname'), wfill:$('wfill'), wammo:$('wammo'), buffs:$('buffs'),
             toast:$('toast'), toasttxt:$('toasttxt'), toastsub:$('toastsub'),
             veil:$('veil'), panel:$('panel') };
let shownScore = 0;
function drawHUD(){
  shownScore += (score-shownScore)*.18;
  el.score.textContent = Math.round(shownScore).toLocaleString('en-GB');
  el.mult.textContent = '×'+mult;
  el.mult.style.fontSize = (30 + Math.min(mult,40)*.35)+'px';
  el.wave.textContent = String(sector).padStart(2,'0');

  let pips='';
  for(let i=0;i<5;i++) pips += `<span class="pip ${i<lives?'':'off'}"></span>`;
  for(let i=0;i<5;i++) pips += `<span class="pip b ${i<bombs?'':'off'}"></span>`;
  if(el.pips.dataset.k !== lives+'/'+bombs){ el.pips.innerHTML = pips; el.pips.dataset.k = lives+'/'+bombs; }

  const w = WEAPONS[curW];
  el.wname.textContent = w.name;
  el.wname.style.color = w.colour;
  el.wfill.style.background = w.colour;
  el.wfill.style.boxShadow = '0 0 12px '+w.colour;
  const frac = ammo[curW]===Infinity ? 1 : clamp(ammo[curW]/w.cap,0,1);
  el.wfill.style.transform = 'scaleX('+frac+')';
  el.wammo.textContent = ammo[curW]===Infinity ? 'UNLIMITED' : Math.ceil(ammo[curW])+' / '+w.cap;

  let bh='';
  const rows = [];
  if(shieldHits>0) rows.push(['AEGIS','#63f7ff', shieldHits/3]);
  if(buffs.overdrive>0) rows.push(['OVERDRIVE','#ffb02e', buffs.overdrive/12]);
  if(buffs.timewarp>0) rows.push(['STASIS','#a98bff', buffs.timewarp/9]);
  if(buffs.magnet>0) rows.push(['LODESTONE','#b8ff3d', buffs.magnet/14]);
  if(buffs.drones>0) rows.push(['WINGMEN','#ff3fa4', buffs.drones/16]);
  for(const [n,c,f] of rows)
    bh += `<div class="buff" style="color:${c}"><span>${n}</span><span class="bar"><i style="background:${c};transform:scaleX(${f.toFixed(3)})"></i></span></div>`;
  if(el.buffs.dataset.k !== bh){ el.buffs.innerHTML = bh; el.buffs.dataset.k = bh; }
}
let toastT = 0;
function toast(txt, sub, ms, col){
  el.toasttxt.textContent = txt;
  el.toastsub.textContent = sub||'';
  el.toast.style.color = col || '#eaf6ff';
  el.toast.style.opacity = 1;
  toastT = ms/1000;
}

  el.panel.innerHTML = `
    <h1 class="glyph">HYPERGON</h1>
    <p class="tag">Twin-stick vector arena · nine hostile geometries · six weapons</p>
    <div class="keys">
      <div class="key"><b>MOVE</b><span>W A S D &nbsp;/&nbsp; left stick &nbsp;/&nbsp; left thumb</span></div>
      <div class="key"><b>AIM &amp; FIRE</b><span>Mouse + hold click &nbsp;/&nbsp; arrow keys &nbsp;/&nbsp; right stick. F locks auto-fire on.</span></div>
      <div class="key"><b>SHOCKWAVE</b><span>Space or right-click — clears the board</span></div>
      <div class="key"><b>SWAP WEAPON</b><span>Q / E through anything you're carrying</span></div>
      <div class="key"><b>PICKUPS</b><span>Hexagons are weapons. Stars are powers.</span></div>
      <div class="key"><b>MULTIPLIER</b><span>Green gems raise it. Dying resets it.</span></div>
    </div>
    <button class="cta" id="go">Launch</button>
    <p class="fine">Best ${best.toLocaleString('en-GB')} &nbsp;·&nbsp; P pause · M mute · B bloom · F auto-fire</p>`;
  $('go').onclick = startRun;
}
function overPanel(){
  el.panel.innerHTML = `
    <h1 class="glyph" style="font-size:clamp(34px,7vw,74px)">SIGNAL LOST</h1>
    <div class="stats">
      <div><span class="lbl">Score</span><div class="val">${score.toLocaleString('en-GB')}</div></div>
      <div><span class="lbl">Best</span><div class="val" style="color:var(--acid)">${best.toLocaleString('en-GB')}</div></div>
      <div><span class="lbl">Kills</span><div class="val">${kills}</div></div>
      <div><span class="lbl">Survived</span><div class="val">${elapsed.toFixed(0)}s</div></div>
    </div>
    <button class="cta" id="go">Run it back</button>
    <p class="fine">or press Enter</p>`;
  $('go').onclick = startRun;
}
function pausePanel(){
  el.panel.innerHTML = `
    <h1 class="glyph" style="font-size:clamp(34px,7vw,74px)">HOLDING</h1>
    <p class="tag">Score ${score.toLocaleString('en-GB')} · Sector ${sector} · ×${mult}</p>
    <button class="cta" id="go">Resume</button>
    <p class="fine">P or Esc</p>`;
  $('go').onclick = togglePause;
}
function startRun(){
  resetRun();
  state = 'play';
  el.veil.classList.add('hide');
  toast('SECTOR 01', sectorName(1), 1500, '#63f7ff');
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
}
function togglePause(){
  if(state==='play'){ state='paused'; pausePanel(); el.veil.classList.remove('hide'); }
  else if(state==='paused'){ state='play'; el.veil.classList.add('hide'); }
}
function gameOver(){
  state='over';
  if(score>best){ best=score; try{ localStorage.setItem('hypergon.best', String(best)); }catch(e){} }
  setTimeout(()=>{ if(state==='over'){ overPanel(); el.veil.classList.remove('hide'); } }, 900);
}

// ---------------------------------------------------------- loop
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now-last)/1000; last = now;
  dt = Math.min(dt, 1/30);
  if(hitstop>0){ hitstop-=dt; dt*=.18; }

  if(toastT>0){ toastT-=dt; if(toastT<=0) el.toast.style.opacity=0; }

  if(state==='play' || state==='over'){
    if(state==='play') update(dt);
    else { updateGrid(dt); for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt; if(p.life<=0){parts.splice(i,1);continue;} p.x+=p.vx*dt;p.y+=p.vy*dt;} shake=Math.max(0,shake-dt*46); }
    render();
    drawHUD();
  } else if(state==='paused'){
    render();
  } else {
    // attract mode: idle grid ripples
    if(Math.random()<.05) gridImpulse(rnd(W),rnd(H), rnd(-7,-2), rnd(360,200));
    updateGrid(dt);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle='#05060f'; ctx.fillRect(0,0,W,H);
    drawGrid();
    if(bloomOn){
      bctx.setTransform(1,0,0,1,0,0);
      bctx.clearRect(0,0,bloomC.width,bloomC.height);
      bctx.filter='blur(2.5px)'; bctx.drawImage(cvs,0,0,bloomC.width,bloomC.height); bctx.filter='none';
      ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=.5;
      ctx.drawImage(bloomC,0,0,W,H);
      ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    }
  }
}

// ---------------------------------------------------------- boot
resize();
player.x=W/2; player.y=H/2;
for(const k in WEAPONS) ammo[k] = k==='pulse' ? Infinity : 0;
menuPanel();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
